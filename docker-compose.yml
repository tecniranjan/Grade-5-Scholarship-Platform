services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: genius_one
      POSTGRES_USER: genius_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-genius_secret_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genius_admin -d genius_one"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "5001:3001"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: genius_one
      DB_USER: genius_admin
      DB_PASSWORD: ${DB_PASSWORD:-genius_secret_2026}
      JWT_SECRET: ${JWT_SECRET:-genius_jwt_secret_2026}
      PORT: 3001
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
